name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# No credentials, no database, no live Spotify calls.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: spot-no-spotify-secrets over every tracked file
        run: git ls-files -z -- . ':!uv.lock' | xargs -0 python3 scripts/hooks/check_secrets.py
      - name: dbt parse (profile from template; parse does not connect)
        env:
          SPOT_SESSION: ci
          SPOT_PG_USER: ci
          SPOT_PG_PASSWORD: ci
        run: |
          mkdir -p ~/.dbt
          cp profiles.yml.example ~/.dbt/profiles.yml
          cd dbt && uv run dbt parse

  # Full history on every run — not the pushed commit range. A secret committed and later removed
  # passes a tree scan and a range scan; it does not pass this. (spot-main-R-020)
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Scan every commit with pinned gitleaks
        run: scripts/ci/gitleaks_history.sh
