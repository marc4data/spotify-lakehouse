[project]
name = "spotify-lakehouse"
version = "0.1.0"
description = "Local Postgres warehouse of family Spotify listening data, modeled to Kimball standards."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "structlog>=24.1",
]

[project.scripts]
spot = "spotify_lakehouse.cli:main"

[dependency-groups]
dev = [
    "dbt-postgres>=1.8",
    "jupyterlab>=4.2",
    "matplotlib>=3.11.2",
    "nbstripout>=0.7",
    "plotly>=7.0.0",
    "pre-commit>=3.8",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spotify_lakehouse"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt/target", "dbt/dbt_packages", "dbt/logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
