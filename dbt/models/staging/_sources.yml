version: 2

sources:
  - name: raw
    schema: raw
    description: Extractor output. Append-only; never modified after insert (data-contracts §1).
    tables:
      - name: api_response
        description: One row per Spotify Web API response, as received minus contract-discarded fields.
        columns:
          - name: id
            tests: [unique, not_null]
          - name: feed
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [me, recently_played, artist]
          - name: profile_slug
            tests: [not_null]
      - name: external_response
        description: >
          One row per response from a non-Spotify source (R-024), keyed by the id requested. No
          profile_slug: an artist's genres are the same whoever played them.
        columns:
          - name: id
            tests: [unique, not_null]
          - name: source
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [musicbrainz]
          - name: feed
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [isrc_lookup, artist]

  - name: spot_meta
    schema: spot_meta
    description: Project bookkeeping loaded by the CLI, not by the extractor.
    tables:
      - name: profile_registry
        description: >
          Household role and home timezone per profile, synced from ~/.config/spot/profiles.csv by
          `spot sync-profiles`. Never stored in the repo.
        columns:
          - name: profile_slug
            tests: [unique, not_null]
      - name: poll_run
        description: One row per profile per `spot refresh` poll (R-017).
        columns:
          - name: id
            tests: [unique, not_null]
      - name: api_access_observation
        description: >
          Whether each registry profile had a stored refresh token, per refresh run (R-033). A boolean;
          never the token.
        columns:
          - name: id
            tests: [unique, not_null]
