version: 2

models:
  - name: br_content_artist
    description: One row per (content_key, artist_key); exactly one primary per track.
    tests:
      - dbt_utils_free_unique_combination:
          arguments:
            columns: [content_key, artist_key]
    columns:
      - name: content_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_content')
                field: content_key
      - name: artist_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_artist')
                field: artist_key
