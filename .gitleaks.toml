# gitleaks configuration for spotify-lakehouse (spot-main-R-020).
# Read automatically by the pre-commit hook (repo root) and passed explicitly by scripts/ci/gitleaks_history.sh.
#
# Why this file exists: gitleaks' default rules alone are close to blind to a Spotify credential. Measured on
# 40 random 32-hex values with v8.30.0: `SPOTIFY_CLIENT_ID=<hex>` 0/10 caught, bare `<hex>` 0/10,
# `SPOTIFY_CLIENT_SECRET=<hex>` 7/10 (misses were entropy < 3.5). A Client ID has no "secret" keyword and
# hex tops out at 4.0 bits of entropy, so the generic rule cannot be relied on for this shape.

title = "spotify-lakehouse"

[extend]
useDefault = true

[[rules]]
id = "spot-hex32"
description = "Standalone 32-hex string: the shape of a Spotify Client ID or Client Secret (CLAUDE.md §5)"
# RE2 has no lookarounds; bound the match with non-hex characters or line edges instead.
regex = '''(?:^|[^0-9A-Fa-f])([0-9A-Fa-f]{32})(?:[^0-9A-Fa-f]|$)'''
secretGroup = 1
keywords = []

  # Same escape hatch as scripts/hooks/check_secrets.py, for genuine test fixtures.
  [[rules.allowlists]]
  description = "explicit per-line pragma"
  regexTarget = "line"
  regexes = ['''spot: allow-secret-shape''']

  # Lockfile hashes are 64-hex and never match, but keep the lockfile out of this rule on principle.
  [[rules.allowlists]]
  description = "uv lockfile"
  paths = ['''(^|/)uv\.lock$''']
